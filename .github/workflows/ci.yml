name: "Terraform CI & Security Scan"

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "packer/**"
      - ".github/workflows/**"
      
permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: "Lint, Security & Plan"
    runs-on: ubuntu-latest
    env:
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      TF_VAR_keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      TF_VAR_open_webui_secret_key: ${{ secrets.OPEN_WEBUI_SECRET_KEY }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_route53_delegation_set_id: ${{ vars.ROUTE53_DELEGATION_SET_ID }}
      TF_VAR_vpn_cidrs: ${{ vars.VPN_CIDRS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/aws

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform/aws

      - name: Terraform Plan
        run: terraform plan -no-color -lock=false -input=false
        working-directory: ./terraform/aws

  packer:
    name: "Packer Validate (${{ matrix.template }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [ollama, bastion, monitoring, open-webui, keycloak]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Packer Init
        run: packer init .
        working-directory: ./packer/${{ matrix.template }}

      - name: Packer Format Check
        run: packer fmt -check .
        working-directory: ./packer/${{ matrix.template }}

      - name: Packer Validate
        run: packer validate .
        working-directory: ./packer/${{ matrix.template }}
